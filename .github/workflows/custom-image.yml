name: Custom image

# Builds our custom Kaneo image when a v<upstream>-custom tag is pushed, and
# publishes it to this fork's GHCR. Upstream's image workflows run only on
# main and need upstream's secrets, so they never run here.
on:
  push:
    tags:
      - "v*-custom"

permissions: {}

concurrency:
  group: custom-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: endsWith(github.ref_name, '-custom')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # v2.50.0-custom -> 2.50.0-custom and 2.50.0-<short sha>, the same tags
      # scripts\build-image.ps1 gives a local build.
      - name: Compute image tags
        id: version
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${TAG#v}"
          upstream="${version%-custom}"
          image="ghcr.io/${OWNER,,}/kaneo"
          {
            echo "version=$version"
            echo "image=$image"
            echo "tags<<EOF"
            echo "$image:$version"
            echo "$image:$upstream-${SHA:0:7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile.kaneo
          platforms: linux/amd64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
